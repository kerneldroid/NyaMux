name: PR Debug Build

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate ephemeral signing key
        id: keysign
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          KEYSTORE="${RUNNER_TEMP}/pr-${GITHUB_RUN_ID}-debug.jks"
          PASSWORD=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
          ALIAS="pr${GITHUB_RUN_ID}$(date +%s)"
          keytool -genkeypair \
            -keystore "${KEYSTORE}" -storetype PKCS12 \
            -storepass "${PASSWORD}" -keypass "${PASSWORD}" \
            -alias "${ALIAS}" -keyalg RSA -keysize 4096 -sigalg SHA256withRSA \
            -validity 2190 \
            -dname "CN=Nyamux PR Build ${GITHUB_RUN_ID}, OU=Pull Request Verification, O=NyaMux"
          {
            echo "NYAMUX_DEBUG_STORE_FILE=${KEYSTORE}"
            echo "NYAMUX_DEBUG_STORE_PASSWORD=${PASSWORD}"
            echo "NYAMUX_DEBUG_KEY_ALIAS=${ALIAS}"
            echo "NYAMUX_DEBUG_KEY_PASSWORD=${PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Assemble debug APK
        env:
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '0'
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify signature
        run: |
          ${JAVA_HOME}/bin/jarsigner -verify app/build/outputs/apk/debug/app-debug.apk | tail -2

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Nyamux-debug-pr-${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
